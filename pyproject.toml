[project]
name = "vigia"
version = "0.1.0"
description = "Backend científico y pipelines de VIGÍA"
requires-python = ">=3.12,<3.14"
dependencies = [
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "httpx[socks]==0.28.1",
  "pydantic-settings==2.12.0",
  "sqlalchemy[asyncio]==2.0.48",
  "structlog==25.5.0",
  "uvicorn[standard]==0.41.0",
]

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.5",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = [
  "services.api.vigia_api",
  "vigia_ai.confidence",
  "vigia_ai.fusion",
  "vigia_ai.detection",
  "workers.aemet",
  "workers.copernicus",
  "workers.eumetsat",
  "workers.firms.vigia_firms",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "services/api/vigia_api",
  "workers/firms/vigia_firms",
  "vigia_ai",
]
